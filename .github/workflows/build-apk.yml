{"name":"Build APK","on":["push","workflow_dispatch"],"jobs":{"apk":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Find the project","id":"proj","run":"if [ -f settings.gradle ]; then\n  echo \"dir=.\" >> \"$GITHUB_OUTPUT\"\nelse\n  z=$(ls ./*.zip 2>/dev/null | head -n1)\n  if [ -z \"$z\" ]; then\n    echo \"No project found: upload wwe2k_to_wii_android.zip to the repository.\"\n    exit 1\n  fi\n  mkdir -p _proj\n  unzip -q \"$z\" -d _proj\n  s=$(find _proj -name settings.gradle | head -n1)\n  echo \"dir=$(dirname \"$s\")\" >> \"$GITHUB_OUTPUT\"\nfi\n"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.5"}},{"name":"Accept the Android SDK licences","run":"yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses > /dev/null || true"},{"name":"Build the APK","working-directory":"${{ steps.proj.outputs.dir }}","run":"gradle --no-daemon :app:assembleRelease"},{"uses":"actions/upload-artifact@v4","with":{"name":"wwe2k-to-wii-apk","path":"${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk"}}]}}}
